<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23406B">
<title>福岡自由行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#23406B; --red:#D9482F; --yellow:#F2B441; --pink:#E58FA6; --green:#2F7D6B; --sky:#7FB9D6;
  --bg:#EEF4F3; --card:#FFFFFF; --ink:#1E2B3A; --muted:#566575; --line:#D7E1E4;
  --t-spot:#E3F0F7; --t-food:#FDF0D4; --t-shop:#FBE6EC; --t-base:#F3F5F6;
  --radius:16px; --bd:1.5px solid var(--blue);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3,h4{line-height:1.35;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.card{background:var(--card);border:var(--bd);border-radius:var(--radius);padding:16px;margin:0 0 14px}
.tag{display:inline-block;font-size:13px;line-height:1;padding:5px 9px;border-radius:999px;font-weight:700;vertical-align:middle}
.tag-sample{background:var(--yellow);color:var(--blue)}
.muted{color:var(--muted)}
.notice{background:#FFF8E8;border:1.5px dashed var(--yellow);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;font-size:15px}
.sec-title{font-size:22px;color:var(--blue);margin:4px 0 14px}
.sub{font-size:18px;color:var(--blue);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border:var(--bd);border-radius:12px;background:#fff;color:var(--blue);font-weight:700;text-decoration:none;font-size:15px;line-height:1.2}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.wide{width:100%;min-height:52px;font-size:16px}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.btn-light{background:#fff;color:var(--blue);border-color:#fff;margin-top:12px}
.back{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:56px;border:var(--bd);border-radius:var(--radius);background:#fff;color:var(--blue);font-weight:700;font-size:16px;margin-top:20px}
.back svg{width:20px;height:20px}

/* 首頁 */
.hero{padding-top:16px}
.hero-art{border:var(--bd);border-radius:var(--radius);overflow:hidden;background:#DDEDF3}
.hero-art svg{display:block;width:100%;height:auto}
.hero h1{font-size:27px;margin:16px 0 2px;color:var(--blue);letter-spacing:.02em}
.hero .meta{margin:0;color:var(--muted)}
.lantern{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.8s ease-in-out infinite}
.lantern.b{animation-delay:-1.9s}
.steam path{animation:steam 3.4s ease-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:-1.1s}
.steam path:nth-child(3){animation-delay:-2.2s}
.waves{animation:wave 7s linear infinite}
.waves.w2{animation-duration:11s}
.petal{animation:fall 10s linear infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(-70px,150px) rotate(220deg);opacity:0}}

/* 主選單 */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px;scroll-margin-top:12px}
.menu button{min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 14px;border:var(--bd);border-radius:var(--radius);background:#fff;color:var(--blue);font-weight:700;font-size:17px;text-align:left}
.menu button svg{width:28px;height:28px;flex:none}
.menu button[aria-selected="true"]{background:var(--blue);color:#fff}
.panel[hidden]{display:none}

/* 倒數 */
.count{background:var(--blue);color:#fff;border-color:var(--blue)}
.count .c-lab{margin:0;font-weight:700}
.count .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;margin:6px 0 4px}
.count .num{font-size:44px;font-weight:700;line-height:1.05;color:var(--yellow)}
.count .unit{margin-right:8px}
.count .c-sub{margin:0;font-size:15px;opacity:.85}
.count .next{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12)}

/* 登機證 */
.pass{padding:0;overflow:hidden}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--blue);color:#fff}
.pass.ret .pass-head{background:var(--green)}
.pass-head b{font-size:17px}
.pass-head .dir{font-size:14px;padding:3px 10px;border:1.5px solid #fff;border-radius:999px}
.pass-body{padding:14px 16px 12px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.route .end{text-align:right}
.route .code{font-size:34px;font-weight:700;color:var(--blue);line-height:1.1}
.route .ap{font-size:14px;color:var(--muted);line-height:1.4}
.route .tm{font-size:22px;font-weight:700;margin-top:4px}
.route .tz{font-size:13px;color:var(--muted)}
.route .mid{display:flex;flex-direction:column;align-items:center;color:var(--red);font-size:13px;font-weight:700}
.route .mid svg{width:30px;height:30px}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 16px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:var(--bd)}
.perf::before{left:-29px}.perf::after{right:-29px}
.pass-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 16px;margin:0}
.pass-foot div{min-width:0}
.pass-foot dt{font-size:13px;color:var(--muted)}
.pass-foot dd{margin:0;font-weight:700;font-size:15px;line-height:1.4}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.facts div{border-radius:12px;background:var(--bg);padding:10px 12px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:700;line-height:1.4}

/* 每日行程 */
.days-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.days-pick button{min-height:72px;border:var(--bd);border-radius:14px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;color:var(--blue)}
.days-pick .dn{font-size:13px;color:var(--muted)}
.days-pick .dd{font-size:19px;font-weight:700}
.days-pick .dw{font-size:14px}
.days-pick button[aria-pressed="true"]{background:var(--blue);color:#fff}
.days-pick button[aria-pressed="true"] .dn{color:#fff}
.daybar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.sum{width:100%;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border:var(--bd);border-radius:var(--radius);text-align:left;min-height:58px}
.sum[aria-expanded="true"]{border-radius:16px 16px 0 0}
.sum .w-ico{width:34px;height:34px;flex:none}
.sum .s-main{flex:1;min-width:0}
.sum .s-l1{font-weight:700;line-height:1.4}
.sum .s-l2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.sum .chev{width:20px;height:20px;flex:none;transition:transform .2s}
.sum[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sum-more{background:#fff;border:var(--bd);border-top:1px solid var(--line);border-radius:0 0 16px 16px;padding:12px 14px 14px;max-height:60vh;overflow:auto}
.sum-more h4{font-size:15px;color:var(--blue);margin:0 0 4px}
.sum-more p{margin:0 0 10px}
.wx{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.wx span b{color:var(--blue)}
.day-head{margin:8px 0 6px}
.day-head h3{font-size:20px;color:var(--blue)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--bd);border-radius:999px;overflow:hidden;background:#fff;margin:10px 0 16px}
.seg button{min-height:48px;border:0;background:transparent;font-weight:700;color:var(--blue);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:22px;height:22px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.seg button:disabled{color:#9AA8B4;cursor:not-allowed}
.seg-note{font-size:14px;color:var(--muted);margin:-8px 0 14px;text-align:center}

.tl > *{animation:pop .55s cubic-bezier(.34,1.45,.55,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.97)}60%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:none}}
.item{border:var(--bd);border-radius:var(--radius);padding:14px 16px;transition:opacity .2s}
.t-spot{background:var(--t-spot)} .t-food{background:var(--t-food)} .t-shop{background:var(--t-shop)} .t-base{background:var(--t-base);border-color:#8A99A6}
.item .head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.item .time{font-weight:700;font-size:18px;color:var(--blue);margin-right:4px}
.kind{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;line-height:1}
.k-spot{background:var(--sky);color:var(--blue)} .k-food{background:var(--yellow);color:var(--blue)} .k-shop{background:var(--pink);color:var(--blue)} .k-base{background:#DCE2E6;color:var(--blue)}
.must{background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;line-height:1}
.item h3{font-size:19px;color:var(--blue)}
.item .note{margin:6px 0 0}
.item dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0}
.item dt{color:var(--muted);font-size:15px;white-space:nowrap}
.item dd{margin:0}
.item .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.item.done{opacity:.6}
.item.done h3{text-decoration:line-through}
.move{margin:0 0 0 22px;padding:10px 0 10px 18px;border-left:2.5px dashed var(--sky);font-size:15px}
.leg{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.leg .mode{flex:none;font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:2px;line-height:1.1;color:#fff;background:var(--blue)}
.m-walk{background:var(--green)!important}
.m-bus{background:var(--yellow)!important;color:var(--blue)!important}
.m-car{background:var(--pink)!important;color:var(--blue)!important}
.m-train{background:var(--red)!important}
.leg .rt{font-weight:700;display:block;line-height:1.45}
.leg small{display:block;color:var(--muted);font-size:14px;line-height:1.5}

/* 表單與花費 */
.field{display:block;margin:0 0 10px;border:0;padding:0;min-width:0}
.field > span,.field legend{display:block;font-size:14px;color:var(--muted);margin-bottom:4px;padding:0}
.field input,.field select,.inp{width:100%;min-height:46px;border:1.5px solid #B4C3CA;border-radius:12px;padding:8px 12px;background:#fff;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;border:1.5px solid var(--blue);border-radius:999px;font-size:15px;background:#fff;cursor:pointer}
.chip input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.chip:has(input:checked){background:#E3ECF6}
.mini{display:flex;gap:8px;margin-top:8px}
.mini button{border:1.5px solid #B4C3CA;background:#fff;border-radius:10px;padding:4px 12px;font-size:14px;min-height:36px}
.err{color:var(--red);font-size:14px;margin:0 0 8px;min-height:0}
.exp-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exp-row .e-main{flex:1;min-width:0}
.exp-row .e-name{font-weight:700;line-height:1.4}
.exp-row .e-meta{font-size:14px;color:var(--muted);line-height:1.4}
.exp-row .amt{text-align:right;font-weight:700;line-height:1.35;white-space:nowrap}
.exp-row .amt small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.del{width:40px;height:40px;flex:none;border:1.5px solid #C6D1D6;border-radius:10px;background:#fff;color:var(--muted);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:1.5px solid var(--blue);font-weight:700}
.total .big{font-size:20px;color:var(--blue)}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px;font-size:15px}
.rate input{width:110px;min-height:42px}

/* 清單 */
.bar{height:14px;border-radius:999px;background:#DCE6E8;overflow:hidden;border:1.5px solid var(--blue);margin:8px 0}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.ck{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ck label{flex:1;display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer}
.ck input{width:24px;height:24px;accent-color:var(--green);flex:none;margin:0}
.ck.done span{text-decoration:line-through;color:var(--muted)}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1}
.add .btn{flex:none}

/* 速查 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 12px}
.kv dt{color:var(--muted);font-size:15px;white-space:nowrap}
.kv dd{margin:0;font-weight:500}
.tel{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel:first-of-type{border-top:0}
.tel b{display:block;color:var(--blue)}
.tel small{display:block;color:var(--muted);font-size:14px;line-height:1.4}
.tel .num{flex:none;font-weight:700;font-size:18px;color:#fff;background:var(--red);border-radius:12px;padding:6px 12px}
.tel .num.alt{background:var(--blue);font-size:15px}
.area{padding:10px 0;border-top:1px solid var(--line)}
.area:first-of-type{border-top:0}
.area h4{color:var(--blue);font-size:17px}
.area p{margin:2px 0}
.list{margin:6px 0 0;padding-left:20px}
.list li{margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:14px;border-top:0}
td.r,th.r{text-align:right;white-space:nowrap}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.tx b{color:var(--blue)}
.mem{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mem input{flex:1}
.foot{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
.reset{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}

@media (max-width:360px){
  .row2{grid-template-columns:1fr}
  .pass-foot{grid-template-columns:1fr 1fr}
  .route .code{font-size:28px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .steam path{opacity:.7}
  .petal{display:none}
}
</style>
</head>
<body>
<div class="wrap">

<header class="hero">
  <div class="hero-art">
    <svg viewBox="0 0 360 230" role="img" aria-label="福岡插畫：福岡塔、那珂川畔的中洲屋台與太宰府梅花">
      <defs>
        <g id="plum"><circle cx="0" cy="-3.6" r="3.2"/><circle cx="3.4" cy="-1.1" r="3.2"/><circle cx="2.1" cy="2.9" r="3.2"/><circle cx="-2.1" cy="2.9" r="3.2"/><circle cx="-3.4" cy="-1.1" r="3.2"/></g>
      </defs>
      <rect width="360" height="230" fill="#DDEDF3"/>
      <circle cx="158" cy="46" r="15" fill="#F2B441"/>
      <g fill="#FFFFFF">
        <rect x="20" y="30" width="38" height="10" rx="5"/><rect x="30" y="24" width="20" height="10" rx="5"/>
        <rect x="196" y="52" width="44" height="10" rx="5"/><rect x="208" y="46" width="22" height="10" rx="5"/>
      </g>
      <!-- 遠景城市 -->
      <g fill="#C2DBE5">
        <rect x="0" y="128" width="30" height="40"/><rect x="28" y="112" width="22" height="56"/>
        <rect x="96" y="120" width="26" height="48"/><rect x="120" y="134" width="34" height="34"/>
        <rect x="152" y="116" width="20" height="52"/><rect x="300" y="124" width="30" height="44"/>
        <rect x="328" y="108" width="32" height="60"/>
      </g>
      <!-- 福岡塔 -->
      <g stroke="#23406B" stroke-width="1.5" stroke-linejoin="round">
        <line x1="70" y1="40" x2="70" y2="14" stroke-linecap="round"/>
        <polygon points="60,168 80,168 75,40 65,40" fill="#7FB9D6"/>
        <rect x="61.5" y="56" width="17" height="11" rx="2" fill="#23406B"/>
        <path d="M66 82 L76 100 M64.5 106 L77 128 M63 134 L78.5 156" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
      </g>
      <!-- 河岸 -->
      <rect x="0" y="166" width="360" height="14" fill="#2F7D6B"/>
      <!-- 熱食鍋與蒸氣 -->
      <g class="steam" fill="none" stroke="#A7C1CE" stroke-width="2.6" stroke-linecap="round">
        <path d="M174 140 q-4 -6 0 -12 q4 -6 0 -12"/>
        <path d="M182 140 q-4 -6 0 -12 q4 -6 0 -12"/>
        <path d="M190 140 q-4 -6 0 -12 q4 -6 0 -12"/>
      </g>
      <g stroke="#23406B" stroke-width="1.5" stroke-linejoin="round">
        <rect x="168" y="152" width="28" height="14" fill="#FFFFFF"/>
        <path d="M170 152 h24 v-8 h-24z" fill="#D9482F"/>
      </g>
      <!-- 屋台 -->
      <g stroke="#23406B" stroke-width="1.5" stroke-linejoin="round">
        <line x1="208" y1="100" x2="208" y2="124"/><line x1="284" y1="100" x2="284" y2="124"/>
        <rect x="204" y="128" width="84" height="34" fill="#FFFFFF"/>
        <rect x="198" y="123" width="96" height="6" fill="#F2B441"/>
        <path d="M226 123 h18 v-5 a2 2 0 0 0 -2 -2 h-14 a2 2 0 0 0 -2 2z" fill="#E58FA6"/>
        <polygon points="192,100 300,100 290,85 202,85" fill="#23406B"/>
        <rect x="204" y="100" width="84" height="14" fill="#D9482F"/>
        <g stroke="#FFFFFF" stroke-width="1.2"><line x1="225" y1="101" x2="225" y2="113"/><line x1="246" y1="101" x2="246" y2="113"/><line x1="267" y1="101" x2="267" y2="113"/></g>
        <text x="246" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#D9482F" stroke="none" font-family="Noto Sans TC, sans-serif">屋台</text>
        <circle cx="220" cy="166" r="8" fill="#FFFFFF"/><circle cx="272" cy="166" r="8" fill="#FFFFFF"/>
      </g>
      <g class="lantern">
        <line x1="196" y1="100" x2="196" y2="106" stroke="#23406B" stroke-width="1.5"/>
        <ellipse cx="196" cy="114" rx="6" ry="8" fill="#F2B441" stroke="#23406B" stroke-width="1.5"/>
        <path d="M190.6 110.5 h10.8 M190.6 117.5 h10.8" stroke="#D9482F" stroke-width="1.2"/>
      </g>
      <g class="lantern b">
        <line x1="296" y1="100" x2="296" y2="106" stroke="#23406B" stroke-width="1.5"/>
        <ellipse cx="296" cy="114" rx="6" ry="8" fill="#F2B441" stroke="#23406B" stroke-width="1.5"/>
        <path d="M290.6 110.5 h10.8 M290.6 117.5 h10.8" stroke="#D9482F" stroke-width="1.2"/>
      </g>

/* ---------- 時間 ---------- */
function toUTC(iso, tz) {
  const [d, t] = iso.split('T'); const [y, m, da] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number);
  return Date.UTC(y, m - 1, da, h - tz, mi);
}
function jstNow() { const d = new Date(Date.now() + 9 * 3600e3); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
function startUTC() { const [y, m, d] = TRIP.startDate.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function dayIndexJST() { const n = jstNow(); return Math.round((Date.UTC(n.y, n.m, n.d) - startUTC()) / 864e5); }
function dayDate(k) { const dt = new Date(startUTC() + k * 864e5); return { md: (dt.getUTCMonth() + 1) + '/' + dt.getUTCDate(), w: WK[dt.getUTCDay()] }; }
function isoDate(iso) { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); const dt = new Date(Date.UTC(y, m - 1, d)); return m + '/' + d + '（' + WK[dt.getUTCDay()] + '）'; }
function durText(ms) { const m = Math.round(ms / 6e4); return Math.floor(m / 60) + ' 小時 ' + (m % 60) + ' 分'; }
const FIRST = TRIP.flights[0], LAST = TRIP.flights[TRIP.flights.length - 1];
const DEP = toUTC(FIRST.dep.time, FIRST.dep.tz), END = toUTC(LAST.arr.time, LAST.arr.tz);
function todayIdx() { const now = Date.now(); if (now < DEP || now > END) return -1; return clamp(dayIndexJST(), 0, TRIP.days.length - 1); }

/* ---------- 行程資料 ---------- */
function plan(i) {
  const day = TRIP.days[i];
  const mode = S.mode[i] === 'rainy' && day.rainy ? 'rainy' : 'sunny';
  const byId = {}; day.sunny.forEach(x => byId[x.id] = x);
  const list = mode === 'rainy' ? day.rainy : day.sunny;
  return list.map(x => {
    if (typeof x === 'string') return byId[x];
    if (x.ref) { const o = Object.assign({}, byId[x.ref], x); o.id = x.ref; delete o.ref; return o; }
    return x;
  }).filter(Boolean);
}
function nextEvent(idx) {
  const items = plan(idx), now = jstNow().min;
  const nx = items.find(it => t2m(it.time) > now);
  if (nx) return '下一個行程：<b>' + esc(nx.time) + ' ' + esc(nx.name) + '</b>';
  if (idx + 1 < TRIP.days.length) { const f = plan(idx + 1)[0]; return '今天的行程結束了，好好休息。明天 <b>' + esc(f.time) + ' ' + esc(f.name) + '</b>'; }
  return '行程全部結束，準備回家囉。';
}

function updateCountdown() {
  const el = $('#countdown'); if (!el) return;
  const now = Date.now();
  if (now < DEP) {
    let ms = DEP - now; const d = Math.floor(ms / 864e5); ms -= d * 864e5; const h = Math.floor(ms / 36e5); ms -= h * 36e5; const m = Math.floor(ms / 6e4);
    el.innerHTML = `<p class="c-lab">距離出發還有</p>
      <div class="big"><span class="num">${d}</span><span class="unit">天</span><span class="num">${h}</span><span class="unit">時</span><span class="num">${m}</span><span class="unit">分</span></div>
      <p class="c-sub">以台灣時間 ${isoDate(FIRST.dep.time)} ${FIRST.dep.time.slice(11, 16)} 起飛計算</p>`;

    const idx = clamp(dayIndexJST(), 0, TRIP.days.length - 1);
    el.innerHTML = `<p class="c-lab">旅程進行中</p>
      <div class="big"><span class="unit">第</span><span class="num">${idx + 1}</span><span class="unit">天（共 ${TRIP.days.length} 天）</span></div>

      <p class="c-sub">到「住宿速查」查看六天總支出與分帳結果。</p>`;
  }
}

/* ---------- 住宿速查 ---------- */
function settle() {
  const bal = {}; S.members.forEach(m => bal[m.id] = { paid: 0, owe: 0 });
  S.expenses.forEach(e => {
    if (bal[e.payer]) bal[e.payer].paid += e.jpy;
    const sh = e.jpy / e.split.length; e.split.forEach(id => { if (bal[id]) bal[id].owe += sh; });
  });
  const net = S.members.map(m => ({ id: m.id, v: Math.round(bal[m.id].paid - bal[m.id].owe) }));
  const cr = net.filter(x => x.v > 0).sort((a, b) => b.v - a.v).map(x => ({ id: x.id, v: x.v }));
  const db = net.filter(x => x.v < 0).sort((a, b) => a.v - b.v).map(x => ({ id: x.id, v: -x.v }));
  const tx = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length) {
    const a = Math.min(db[i].v, cr[j].v);
    if (a >= 1) tx.push({ from: db[i].id, to: cr[j].id, amt: a });
    db[i].v -= a; cr[j].v -= a;
    if (db[i].v < 1) i++; if (cr[j].v < 1) j++;
  }
  return { bal, tx };
}

    <h3 class="sub" style="margin-top:0">住宿${tag(h.sample)}</h3>
    <section class="card">
      <h4 style="font-size:19px;color:var(--blue)">${esc(h.name)}</h4>
      <dl class="kv">
        <dt>地址</dt><dd>${esc(h.address)}</dd>
        <dt>最近車站</dt><dd>${esc(h.station)}</dd>
        <dt>步行</dt><dd>${esc(h.walk)}</dd>
        <dt>入住</dt><dd>${esc(h.checkin)} 起</dd>
        <dt>退房</dt><dd>${esc(h.checkout)} 前</dd>
        <dt>期間</dt><dd>${esc(h.nights)}</dd>
        <dt>房型</dt><dd>${esc(h.rooms)}</dd>
        <dt>訂房編號</dt><dd>${esc(h.booking)}</dd>
        <dt>電話</dt><dd><a href="tel:${esc(h.phone)}">${esc(h.phone)}</a></dd>
      </dl>
      <a class="btn wide" href="${mapURL('@hotel')}" target="_blank" rel="noopener">${IC.map}在 Google 地圖開啟</a>
    </section>

    <h3 class="sub">緊急聯絡</h3>
    <section class="card">
      ${TRIP.emergency.map(e => `<a class="tel" href="tel:${esc(e.num.replace(/[^\d+]/g, ''))}"><span><b>${esc(e.name)}</b><small>${esc(e.note)}</small></span><span class="num${e.red ? '' : ' alt'}">${esc(e.num)}</span></a>`).join('')}
    </section>

    <h3 class="sub">訂位與保險${tag(TRIP.reservations.some(r => r.sample) || ins.sample)}</h3>
    <section class="card">
      <table><thead><tr><th>時間</th><th>內容</th><th class="r">編號</th></tr></thead><tbody>
        ${TRIP.reservations.map(r => `<tr><td>${esc(r.when)}</td><td>${esc(r.name)}（${r.people} 人）</td><td class="r">${esc(r.code)}</td></tr>`).join('')}
      </tbody></table>
      <dl class="kv" style="margin-top:16px">
        <dt>保險公司</dt><dd>${esc(ins.company)}</dd>
        <dt>保單號碼</dt><dd>${esc(ins.policy)}</dd>
        <dt>海外救助</dt><dd><a href="tel:${esc(ins.hotline.replace(/[^\d+]/g, ''))}">${esc(ins.hotline)}</a></dd>
        <dt>保障內容</dt><dd>${esc(ins.cover)}</dd>
      </dl>
      <p class="muted" style="font-size:14px;margin:0">本檔只存在你自己的裝置；若要轉傳給別人，請勿填入護照號碼等個資。</p>
    </section>

    <h3 class="sub">伴手禮與退稅</h3>
    <section class="card">
      ${TRIP.shopping.map(s => `<div class="area"><h4>${esc(s.area)}</h4><p class="muted" style="font-size:15px">${esc(s.where)}</p>
        <ul class="list">${s.buy.map(b => `<li>${esc(b)}</li>`).join('')}</ul><p style="font-size:15px;margin-top:6px"><b>退稅：</b>${esc(s.tax)}</p></div>`).join('')}
    </section>
    <section class="card" style="background:#FFF8E8;border-color:var(--yellow)">
      <h4 style="color:var(--blue);font-size:17px">退稅提醒</h4>
      <ul class="list">${TRIP.taxNotes.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    </section>

    <h3 class="sub">旅程總支出</h3>
    <section class="card">
      ${rateHTML()}
      <div class="total" style="border-top:0;padding-top:0"><span>六天合計</span><span class="big">${fmtJPY(total)}<br><small class="muted" style="font-weight:400;font-size:14px">${fmtTWD(total * S.rate)}・平均每人 ${fmtTWD(total * S.rate / Math.max(1, S.members.length))}</small></span></div>
      <table style="margin-top:12px"><thead><tr><th>日期</th><th class="r">日圓</th><th class="r">新台幣</th></tr></thead><tbody>
        ${byDay.map((v, k) => { const d = dayDate(k); return `<tr><td>第 ${k + 1} 天 ${d.md}（${d.w}）</td><td class="r">${fmtJPY(v)}</td><td class="r">${fmtTWD(v * S.rate)}</td></tr>`; }).join('')}
      </tbody></table>
      ${byCat.length ? `<table style="margin-top:12px"><thead><tr><th>類別</th><th class="r">日圓</th><th class="r">占比</th></tr></thead><tbody>
        ${byCat.map(c => `<tr><td>${c[0]}</td><td class="r">${fmtJPY(c[1])}</td><td class="r">${Math.round(c[1] / total * 100)}%</td></tr>`).join('')}</tbody></table>` : ''}
    </section>

    <h3 class="sub">分帳結算</h3>
    <section class="card">
      <table><thead><tr><th>成員</th><th class="r">已付</th><th class="r">應付</th><th class="r">差額</th></tr></thead><tbody>
        ${S.members.map(m => { const b = st.bal[m.id], n = Math.round(b.paid - b.owe); return `<tr><td>${esc(m.name)}</td><td class="r">${fmtJPY(b.paid)}</td><td class="r">${fmtJPY(b.owe)}</td><td class="r ${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : ''}${fmtJPY(n).replace('¥-', '-¥')}</td></tr>`; }).join('')}
      </tbody></table>
      <h4 style="color:var(--blue);font-size:17px;margin-top:16px">誰該付給誰</h4>
      ${st.tx.length ? st.tx.map(t => `<div class="tx"><span><b>${esc(memName(t.from))}</b> 付給 <b>${esc(memName(t.to))}</b></span><span style="text-align:right;font-weight:700">${fmtJPY(t.amt)}<br><small class="muted" style="font-weight:400">${fmtTWD(t.amt * S.rate)}</small></span></div>`).join('') : '<p class="muted" style="margin:6px 0 0">目前帳目平衡，不需要轉帳。</p>'}
      <p class="muted" style="font-size:14px;margin:12px 0 0">差額為正代表多付、應收回；為負代表應補給他人。結算以最少轉帳次數計算。</p>
    </section>

    <h3 class="sub">旅伴名單${tag(TRIP.membersSample)}</h3>
    <section class="card">
      ${S.members.map(m => `<div class="mem"><input class="inp" data-mem="${esc(m.id)}" value="${esc(m.name)}" maxlength="12" aria-label="成員名稱"><button type="button" class="del" data-del-mem="${esc(m.id)}" aria-label="移除 ${esc(m.name)}">×</button></div>`).join('')}
      <p class="err" id="mem-err"></p>
      <form class="add" id="mem-form" autocomplete="off" style="margin-top:4px"><input class="inp" name="name" required maxlength="12" placeholder="新增旅伴名稱"><button type="submit" class="btn primary">新增</button></form>
      <p class="muted" style="font-size:14px;margin:10px 0 0">改名後直接點其他地方即可儲存。已有花費紀錄的成員無法移除。</p>
    </section>
    <p style="text-align:center"><button type="button" class="reset" data-reset>清除這支手機上的所有紀錄</button></p>`;
}

/* ---------- 切換與事件 ---------- */
const PANELS = { overview: renderOverview, days: renderDays, prep: renderPrep, info: renderInfo };
let curTab = 'overview';
function switchTab(name) {
  curTab = name;
  document.querySelectorAll('#menu [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  Object.keys(PANELS).forEach(k => { $('#p-' + k).hidden = k !== name; });
  PANELS[name]();
}
function toMenu() { $('#menu').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { switchTab(d.tab); return; }
  if (t.hasAttribute('data-back')) { toMenu(); return; }
  if (d.goday !== undefined) { S.day = +d.goday; save(); switchTab('days'); toMenu(); return; }
  if (d.day !== undefined) { S.day = +d.day; save(); renderDays(); return; }
  if (t.id === 'sum-btn') { S.sumOpen = !S.sumOpen; save(); t.setAttribute('aria-expanded', S.sumOpen); $('#sum-more').hidden = !S.sumOpen; return; }
  if (d.mode) { if (t.disabled) return; S.mode[S.day] = d.mode; save(); renderMode(); renderTimeline(); return; }
  if (d.done) {
    const id = d.done, on = !S.done[id];
    if (on) S.done[id] = true; else delete S.done[id];
    save();
    const card = t.closest('.item'); card.classList.toggle('done', on);
    t.classList.toggle('on', on); t.setAttribute('aria-pressed', on); t.innerHTML = IC.check + (on ? '已完成' : '標記完成');
    return;
  }
  if (d.split) { document.querySelectorAll('#exp-form input[name="split"]').forEach(c => c.checked = d.split === 'all'); return; }
  if (d.delExp) { S.expenses = S.expenses.filter(x => x.id !== d.delExp); save(); renderExpenses(); return; }
  if (d.ptab) { S.prepTab = d.ptab; save(); renderPrep(); return; }
  if (d.delCk) { const c = S.checklist; c.todo = c.todo.filter(x => x.id !== d.delCk); c.pack = c.pack.filter(x => x.id !== d.delCk); save(); renderPrep(); return; }
  if (d.delMem) {
    const used = S.expenses.some(x => x.payer === d.delMem || x.split.includes(d.delMem));
    if (used) { $('#mem-err').textContent = memName(d.delMem) + ' 已有花費紀錄，請先刪除相關花費再移除。'; return; }
    if (S.members.length <= 1) { $('#mem-err').textContent = '至少需要保留一位成員。'; return; }
    S.members = S.members.filter(m => m.id !== d.delMem); save(); renderInfo(); return;
  }
  if (t.hasAttribute('data-reset')) {
    if (confirm('確定要清除這支手機上的勾選、清單、花費與旅伴名單嗎？此動作無法復原。')) { try { localStorage.removeItem(KEY); } catch (err) { } location.reload(); }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('rate-input')) {
    const v = parseFloat(t.value);
    if (v > 0) { S.rate = v; save(); if (curTab === 'days') renderExpenses(); if (curTab === 'info') renderInfo(); }
    return;
  }
  if (t.dataset.ck) {
    const c = S.checklist, x = c.todo.concat(c.pack).find(i => i.id === t.dataset.ck);
    if (x) { x.done = t.checked; save(); renderPrep(); }
    return;
  }
  if (t.dataset.mem) {
    const m = S.members.find(i => i.id === t.dataset.mem), v = t.value.trim();
    if (m && v) { m.name = v; save(); renderInfo(); } else if (m) t.value = m.name;
  }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'exp-form') {
    const fd = new FormData(f);
    const name = String(fd.get('name') || '').trim();
    const jpy = parseInt(String(fd.get('jpy') || '').replace(/[^\d]/g, ''), 10);
    const split = fd.getAll('split');
    const err = $('#exp-err');
    if (!name) { err.textContent = '請輸入項目名稱。'; return; }
    if (!(jpy > 0)) { err.textContent = '請輸入日圓金額（數字）。'; return; }
    if (!split.length) { err.textContent = '請至少選一位分攤成員。'; return; }
    S.expenses.push({ id: uid(), day: S.day, name, cat: fd.get('cat'), jpy, payer: fd.get('payer'), split });
    save(); renderExpenses();
  } else if (f.id === 'ck-form') {
    const text = String(new FormData(f).get('text') || '').trim(); if (!text) return;
    const tab = S.prepTab === 'pack' ? 'pack' : 'todo';
    S.checklist[tab].push({ id: uid(), text, done: false }); save(); renderPrep();
    const inp = $('#ck-form input'); if (inp) inp.focus();
  } else if (f.id === 'mem-form') {
    const name = String(new FormData(f).get('name') || '').trim(); if (!name) return;
    S.members.push({ id: 'm' + uid(), name }); save(); renderInfo();
  }
});

/* ---------- 啟動 ---------- */
(function init() {
  $('#trip-title').textContent = TRIP.title;
  const f0 = TRIP.flights[0], f1 = TRIP.flights[TRIP.flights.length - 1];
  $('#trip-meta').textContent = isoDate(f0.dep.time) + ' — ' + isoDate(f1.dep.time) + '・' + TRIP.subtitle;
  document.querySelectorAll('[data-wave]').forEach(p => {
    let d = 'M-40 ' + p.dataset.wave + ' q10 -4 20 0'; for (let i = 0; i < 23; i++) d += ' t20 0';
    p.setAttribute('d', d);
  });
  S.day = clamp(+S.day || 0, 0, TRIP.days.length - 1);
  const ti = todayIdx(); if (ti >= 0) S.day = ti;
  switchTab('overview');
  setInterval(() => { if (curTab === 'overview') updateCountdown(); }, 30000);
})();
</script>
</body>
</html>
